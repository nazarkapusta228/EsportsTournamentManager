services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: esportsdb
      POSTGRES_USER: esports
      POSTGRES_PASSWORD: esportspassword
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esports -d esportsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo1:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mongo-rs.local:host-gateway"
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo2:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    ports:
      - "27018:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mongo-rs.local:host-gateway"
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo3:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    ports:
      - "27019:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mongo-rs.local:host-gateway"
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    entrypoint: ["mongosh"]
    command: ["--quiet", "mongodb://mongo1:27017/admin?directConnection=true", "/scripts/init-replica-set.js"]
    volumes:
      - ./mongodb/init-replica-set.js:/scripts/init-replica-set.js:ro
    restart: "no"

volumes:
  pg_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
